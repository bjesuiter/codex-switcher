name: Publish to npm

on:
  release:
    types: [published]
  push:
    tags:
      - "1.*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run without publishing (dry-run)"
        required: false
        default: false
        type: boolean

jobs:
  prepublish-ci:
    name: Pre-publish CI
    uses: ./.github/workflows/ci.yml

  publish:
    needs: prepublish-ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js (for npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Publish to npm (dry-run)
        if: inputs.dry-run == 'true'
        run: npm publish ./dist --dry-run --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: inputs.dry-run != 'true'
        run: npm publish ./dist --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
