name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build

  windows-shell-smoke:
    name: Windows shell smoke (${{ matrix.label }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: PowerShell (official)
            shell: pwsh
            best_effort: false
          - label: CMD (best-effort)
            shell: cmd
            best_effort: true
          - label: Git Bash (best-effort)
            shell: bash
            best_effort: true

    continue-on-error: ${{ matrix.best_effort }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Smoke test CLI (PowerShell)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          bun run cdx.ts --help
          bun run cdx.ts --version
          bun run cdx.ts doctor

      - name: Smoke test CLI (CMD)
        if: matrix.shell == 'cmd'
        shell: cmd
        run: |
          bun run cdx.ts --help
          bun run cdx.ts --version
          bun run cdx.ts doctor

      - name: Smoke test CLI (Git Bash)
        if: matrix.shell == 'bash'
        shell: bash
        run: |
          bun run cdx.ts --help
          bun run cdx.ts --version
          bun run cdx.ts doctor
